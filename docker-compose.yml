services:
  vigia:
    build: .
    container_name: vigia
    volumes:
      - ./vigia.yaml:/app/vigia.yaml:ro
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-}
      - VIGIA_DB_PATH=/app/data/vigia.db
      - VIGIA_BACKUP_DIR=/app/data/backups
    command: run
    restart: "no"

