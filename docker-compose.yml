services:
  vigia:
    build: .
    container_name: vigia
    volumes:
      - ./vigia.yaml:/app/vigia.yaml:ro
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
    command: run
    restart: unless-stopped

